name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings httpx numpy pytest pytest-asyncio anyio jinja2 python-multipart
          pip install -r requirements.txt || echo "ml deps optional, core installed"

      - name: run tests
        run: pytest -v
        env:
          FORCE_DUMMY_EMBEDDING: 1
